<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckWeb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      background-color: #1f1f1f;
      padding: 15px 24px;
      border-bottom: 1px solid #2d2d2d;
    }

    .logo {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 320px));
      gap: 20px;
    }

    .video-card {
      text-decoration: none;
      color: inherit;
      display: block;
      background-color: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d2d2d;
      transition: transform 0.2s, border-color 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
    }

    .thumbnail-box video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 12px;
    }

    .video-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f1f1;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">DuckWeb</a>
  </header>

  <main>
    <div class="video-grid">
      <!-- Video Card clicking through to watch.html -->
      <a href="watch.html" class="video-card">
        <div class="thumbnail-box">
          <video src="1v4.mp4#t=0.5" preload="metadata"></video>
        </div>
        <div class="video-info">
          <h2 class="video-title">valorant 1v4 clutch?</h2>
        </div>
      </a>
    </div>
  </main>

</body>
</html>
